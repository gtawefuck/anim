<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SoulScythe</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/enhance.css">
</head>
<body data-page="auth" data-auth="login" class="has-video-bg">
<div id="ss-header"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="sub">Sign in to your SoulScythe account</p>
    <div class="form-msg" id="form-msg"></div>
    <form id="login-form" novalidate>
      <div class="field"><label>Email</label><input id="l-email" type="email" autocomplete="email" required></div>
      <div class="field"><label>Password</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <p class="auth-alt"><a href="forgot.html">Forgot your password?</a></p>
    <p class="auth-alt">No account yet? <a href="register.html">Forge one</a></p>
  </div>
</div>
<div id="ss-footer"></div>
<script src="js/data.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/video-bg.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
