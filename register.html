<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — SoulScythe</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/enhance.css">
</head>
<body data-page="auth" data-auth="register" class="has-video-bg">
<div id="ss-header"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Join the Order</h1>
    <p class="sub">Create your SoulScythe account</p>
    <div class="form-msg" id="form-msg"></div>
    <form id="reg-form" novalidate>
      <div class="field"><label>Full Name</label><input id="r-name" autocomplete="name" required></div>
      <div class="field"><label>Email</label><input id="r-email" type="email" autocomplete="email" required></div>
      <div class="field"><label>Password</label><input id="r-pass" type="password" autocomplete="new-password" required></div>
      <div class="field"><label>Confirm Password</label><input id="r-conf" type="password" autocomplete="new-password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <p class="auth-alt" style="font-size:.8rem;color:var(--muted)">We'll email you a 5-digit code and a one-click magic link to verify.</p>
    <p class="auth-alt">Already a hunter? <a href="login.html">Sign in</a></p>
  </div>
</div>
<div id="ss-footer"></div>
<script src="js/data.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/video-bg.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
