<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — SoulScythe</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/enhance.css">
</head>
<body data-page="auth" data-auth="forgot" class="has-video-bg">
<div id="ss-header"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Reset Password</h1>
    <p class="sub">We'll send a reset code and link to your email</p>
    <div class="form-msg" id="form-msg"></div>
    <form id="forgot-form" novalidate>
      <div class="field"><label>Email</label><input id="fp-email" type="email" autocomplete="email" required></div>
      <button type="submit" class="btn btn-primary btn-block">Send Reset Code</button>
    </form>
    <p class="auth-alt">Remembered it? <a href="login.html">Back to login</a></p>
  </div>
</div>
<div id="ss-footer"></div>
<script src="js/data.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/video-bg.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
