<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — SoulScythe</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="forgot">
<div id="ss-header"></div>
<div class="section-bg"><video autoplay muted loop playsinline poster=""><source src="assets/auth.mp4" type="video/mp4"></video><div class="bg-overlay"></div></div>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Reset Password</h1>
    <p class="sub">We'll send a reset scroll to your email</p>
    <div class="form-msg" id="form-msg"></div>
    <form id="forgot-form">
      <div class="field"><label>Email</label><input type="email" required></div>
      <button class="btn btn-primary btn-block">Send Reset Link</button>
    </form>
    <p class="auth-alt">Remembered it? <a href="login.html">Back to login</a></p>
  </div>
</div>
<div id="ss-footer"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
